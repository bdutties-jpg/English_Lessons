<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reading</title>
  <style>
    :root {
      --ink: #1f2937;
      --bubble: #ffffffcc;
      --shadow: rgba(15, 23, 42, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Comic Sans MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.88), transparent 23%),
        radial-gradient(circle at 84% 16%, rgba(255, 255, 255, 0.72), transparent 19%),
        linear-gradient(180deg, #93c5fd 0%, #c4b5fd 42%, #fde68a 100%);
    }

    .page {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .topbar {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 6px 18px rgba(31, 41, 55, 0.12);
      color: #0f172a;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 800;
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .title {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.4rem);
      line-height: 0.95;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #0f172a;
      text-shadow: 0 4px 0 rgba(255, 255, 255, 0.65);
    }

    .subtitle {
      margin: 12px auto 0;
      max-width: 28rem;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--bubble);
      font-size: clamp(1rem, 3.6vw, 1.2rem);
      line-height: 1.35;
      font-weight: 700;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .menu-card {
      display: block;
      min-height: 220px;
      padding: 18px;
      border: none;
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.48), rgba(255, 255, 255, 0.24)),
        var(--card-color, #f9a8d4);
      box-shadow: 0 12px 0 rgba(255, 255, 255, 0.6), 0 18px 34px var(--shadow);
      color: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    .menu-card:active {
      transform: translateY(6px) scale(0.98);
      box-shadow: 0 5px 0 rgba(255, 255, 255, 0.7), 0 10px 18px var(--shadow);
    }

    .menu-inner {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .menu-icon {
      font-size: clamp(3rem, 12vw, 4.5rem);
      line-height: 1;
    }

    .menu-title {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      line-height: 1.15;
      font-weight: 800;
    }

    .menu-subtitle {
      font-size: clamp(1rem, 3.4vw, 1.15rem);
      line-height: 1.2;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a class="back-link" href="../index.html" aria-label="Back to home page">⬅️🏡</a>
    </div>
    <header class="hero">
      <h1 class="title" id="page-title"></h1>
      <p class="subtitle" id="page-subtitle"></p>
    </header>
    <section class="menu-grid" id="menu-grid"></section>
  </main>

  <script>
    const pageConfig = __PAGE_CONFIG_JSON__;
    const colors = ["#f9a8d4", "#93c5fd", "#86efac", "#fdba74", "#fcd34d", "#c4b5fd"];
    const menuGrid = document.getElementById("menu-grid");
    const pageTitle = document.getElementById("page-title");
    const pageSubtitle = document.getElementById("page-subtitle");
    const backLink = document.querySelector(".back-link");
    const player = new Audio();

    async function playThenNavigate(audioPath, href) {
      if (!audioPath) {
        window.location.href = href;
        return;
      }

      player.pause();
      player.currentTime = 0;
      player.src = audioPath;

      try {
        await player.play();
        player.addEventListener(
          "ended",
          () => {
            window.location.href = href;
          },
          { once: true }
        );
      } catch (error) {
        console.error("Unable to play menu audio", error);
        window.location.href = href;
      }
    }

    pageTitle.textContent = pageConfig.title;
    pageSubtitle.textContent = `${pageConfig.subtitle} · ${pageConfig.description}`;

    backLink.addEventListener("click", (event) => {
      event.preventDefault();
      playThenNavigate(pageConfig.backAudio, backLink.getAttribute("href"));
    });

    pageConfig.menuItems.forEach((page, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "menu-card";
      button.style.setProperty("--card-color", colors[index % colors.length]);
      button.setAttribute("aria-label", `${page.title} - ${page.subtitle}`);
      button.innerHTML = `
        <span class="menu-inner">
          <span class="menu-icon">${page.emoji}</span>
          <span class="menu-title">${page.title}</span>
          <span class="menu-subtitle">${page.subtitle}</span>
        </span>
      `;
      button.addEventListener("click", () => playThenNavigate(page.audio, page.href));
      menuGrid.appendChild(button);
    });
  </script>
</body>
</html>
