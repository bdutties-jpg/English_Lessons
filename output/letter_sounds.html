<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="English Playtime" />
  <meta name="application-name" content="English Playtime" />
  <meta name="theme-color" content="#7dd3fc" />
  <meta name="app-version" content="20260627235147" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/icons/icon-512.png" />
  <link rel="manifest" href="../site.webmanifest" />
  <title>Short Sentences</title>
  <style>
    :root {
      --sky: #7dd3fc;
      --sun: #fde047;
      --melon: #fb7185;
      --mint: #6ee7b7;
      --berry: #38bdf8;
      --ink: #1f2937;
      --paper: #fffef5;
      --shadow: rgba(31, 41, 55, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Comic Sans MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.8), transparent 28%),
        radial-gradient(circle at top right, rgba(255, 255, 255, 0.65), transparent 22%),
        linear-gradient(180deg, #8be9ff 0%, #7dd3fc 40%, #fef3c7 100%);
    }

    .page {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .topbar {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 18px rgba(31, 41, 55, 0.12);
      color: #0f172a;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 800;
    }

    .back-link:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.85);
      outline-offset: 3px;
    }

    .hero {
      text-align: center;
      margin-bottom: 20px;
    }

    .title {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #0f172a;
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.65);
    }

    .title.no-uppercase {
      text-transform: none;
    }

    .subtitle {
      margin: 12px auto 0;
      max-width: 34rem;
      font-size: clamp(1rem, 3vw, 1.2rem);
      line-height: 1.4;
      font-weight: 700;
    }

    .subtitle strong {
      display: block;
      font-size: clamp(1.05rem, 3.2vw, 1.3rem);
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
    }

    .sound-button {
      position: relative;
      aspect-ratio: 1 / 1;
      width: 100%;
      border: none;
      border-radius: 28px;
      padding: 14px;
      background: var(--button-color, var(--paper));
      box-shadow: 0 10px 0 rgba(255, 255, 255, 0.6), 0 16px 32px var(--shadow);
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
      overflow: hidden;
      isolation: isolate;
    }

    .sound-button::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.28);
      z-index: -1;
    }

    .sound-button:active {
      transform: translateY(6px) scale(0.98);
      box-shadow: 0 4px 0 rgba(255, 255, 255, 0.65), 0 8px 18px var(--shadow);
    }

    .sound-button:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.85);
      outline-offset: 3px;
    }

    .sound-button.is-playing {
      filter: saturate(1.1);
      transform: translateY(-4px) rotate(-1deg);
    }

    .button-inner {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .emoji {
      font-size: clamp(2.6rem, 10vw, 4rem);
      line-height: 1;
    }

    .label {
      font-size: clamp(1rem, 3.6vw, 1.2rem);
      line-height: 1.2;
      font-weight: 700;
      max-width: 10ch;
    }

    .sound-button.letter-sound-button {
      padding: 12px 12px 18px;
    }

    .sound-button.letter-sound-button .button-inner {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .letter-pair {
      font-size: clamp(1.55rem, 7vw, 2.4rem);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: 0.04em;
      font-family: "Chalkboard SE", "Marker Felt", "Comic Sans MS", "Trebuchet MS", sans-serif;
      text-align: center;
    }

    .letter-note {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 20px;
      font-size: clamp(0.86rem, 2.8vw, 1rem);
      line-height: 1.1;
      font-weight: 700;
      color: rgba(31, 41, 55, 0.58);
      text-align: center;
    }

    .letter-note.is-empty {
      visibility: hidden;
    }

    @media (min-width: 700px) {
      .page {
        padding-top: 36px;
      }

      .button-grid {
        gap: 18px;
      }
    }
  </style>
</head>
<body>

    <header class="hero">
      <h1 class="title" id="page-title"></h1>
      <p class="subtitle"><strong id="page-subtitle"></strong><span id="page-description"></span></p>
    </header>
    <section class="button-grid" id="button-grid"></section>
  </main>

    const palette = ["#fde68a", "#fca5a5", "#86efac", "#93c5fd", "#f9a8d4", "#fdba74"];
    const buttonGrid = document.getElementById("button-grid");
    const pageTitle = document.getElementById("page-title");
    const pageSubtitle = document.getElementById("page-subtitle");
    const pageDescription = document.getElementById("page-description");
    const backLink = document.querySelector(".back-link");
    const player = new Audio();
    const navigationPlayer = new Audio();
    let activeButton = null;

    function withVersion(href, version = appVersion) {
      const url = new URL(href, window.location.href);
      url.searchParams.set("v", version);
      return url.toString();
    }

    async function ensureLatestVersion() {
      try {
        const response = await fetch(`${versionInfoPath}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          return;
        }

        const latest = await response.json();
        if (!latest.version || latest.version === appVersion) {
          return;
        }

        window.location.replace(withVersion(window.location.pathname + window.location.search + window.location.hash, latest.version));
      } catch (error) {
        console.error("Unable to check app version", error);
      }
    }

    pageTitle.textContent = pageConfig.title;
    pageSubtitle.textContent = pageConfig.subtitle;
    pageDescription.textContent = pageConfig.description;
    if (pageConfig.titleUppercase === false) {
      pageTitle.classList.add("no-uppercase");
    }

    function clearPlayingState() {
      if (activeButton) {
        activeButton.classList.remove("is-playing");
        activeButton = null;
      }
    }

    async function playThenNavigate(audioPath, href) {
      const destination = withVersion(href);
      if (!audioPath) {
        window.location.href = destination;
        return;
      }

      navigationPlayer.pause();
      navigationPlayer.currentTime = 0;
      navigationPlayer.src = audioPath;

      try {
        await navigationPlayer.play();
        navigationPlayer.addEventListener(
          "ended",
          () => {
            window.location.href = destination;
          },
          { once: true }
        );
      } catch (error) {
        console.error("Unable to play back audio", error);
        window.location.href = destination;
      }
    }

    void ensureLatestVersion();

    player.addEventListener("ended", clearPlayingState);
    player.addEventListener("pause", clearPlayingState);

    backLink.addEventListener("click", (event) => {
      event.preventDefault();
      playThenNavigate(pageConfig.backAudio, backLink.getAttribute("href"));
    });

    lessons.forEach((lesson, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "sound-button";
      if (pageConfig.buttonStyle === "letter-sounds") {
        button.classList.add("letter-sound-button");
      }
      button.style.setProperty("--button-color", palette[index % palette.length]);
      button.setAttribute("aria-label", lesson.text);

      if (pageConfig.buttonStyle === "letter-sounds") {
        button.innerHTML = `
          <span class="button-inner">
            <span class="letter-pair">${lesson.display ?? lesson.text}</span>
            <span class="letter-note ${lesson.note ? "" : "is-empty"}">${lesson.note || "(note)"}</span>
          </span>
        `;
      } else {
        button.innerHTML = `
          <span class="button-inner">
            <span class="emoji">${lesson.emoji}</span>
            <span class="label">${lesson.text}</span>
          </span>
        `;
      }

      button.addEventListener("click", async () => {
        clearPlayingState();
        activeButton = button;
        button.classList.add("is-playing");

        player.pause();
        player.currentTime = 0;
        player.src = lesson.audio;

        try {
          await player.play();
        } catch (error) {
          clearPlayingState();
          console.error("Unable to play audio", error);
        }
      });

      buttonGrid.appendChild(button);
    });
  </script>
