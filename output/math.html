<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="English Playtime" />
  <meta name="application-name" content="English Playtime" />
  <meta name="theme-color" content="#a5f3fc" />
  <meta name="app-version" content="20261108031344" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/icons/icon-512.png" />
  <link rel="manifest" href="../site.webmanifest" />
  <title>Math</title>
  <style>
    :root {
      --ink: #1f2937;
      --good: #16a34a;
      --bad: #ef4444;
      --shadow: rgba(31, 41, 55, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Trebuchet MS", "Comic Sans MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.85), transparent 25%),
        radial-gradient(circle at top right, rgba(255, 255, 255, 0.7), transparent 20%),
        linear-gradient(180deg, #a5f3fc 0%, #bfdbfe 40%, #fde68a 100%);
    }

    .page {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .topbar {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 6px 18px rgba(31, 41, 55, 0.12);
      color: #0f172a;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 800;
    }

    .back-link:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.85);
      outline-offset: 3px;
    }

    .hero {
      text-align: center;
      margin-top: 24px;
    }

    .title {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 4rem);
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #0f172a;
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.65);
    }

    .subtitle {
      margin: 12px auto 0;
      font-size: clamp(1.1rem, 4vw, 1.35rem);
      font-weight: 800;
    }

    .card {
      margin: 28px auto 0;
      max-width: 46rem;
      padding: 22px 16px 20px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 16px 32px var(--shadow);
      backdrop-filter: blur(6px);
    }

    .problems-stack {
      display: table;
      width: fit-content;
      border-spacing: 0 clamp(12px, 3vw, 20px);
      margin: 0 auto;
    }

    .problem-row {
      display: table-row;
    }

    .star-bank-section {
      margin-top: 18px;
      padding: 14px 10px 4px;
    }

    .star-bank-label {
      margin-bottom: 8px;
      text-align: left;
      font-size: clamp(0.95rem, 3.4vw, 1.05rem);
      font-weight: 900;
      color: #475569;
      letter-spacing: 0.03em;
    }

    .stars-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      justify-content: flex-start;
      align-items: flex-start;
      min-height: 58px;
    }

    .star-token {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      font-size: 2rem;
      line-height: 1;
      filter: drop-shadow(0 5px 10px rgba(250, 204, 21, 0.45));
      animation: bank-star-dance 1700ms ease-in-out infinite;
      animation-delay: var(--dance-delay, 0ms);
    }

    .star-token.placeholder {
      opacity: 0;
      animation: none;
    }

    .floating-star {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 40;
      font-size: 2.3rem;
      line-height: 1;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1.1) rotate(0deg);
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 18px rgba(250, 204, 21, 0.7));
      transition: left 1180ms cubic-bezier(0.22, 1, 0.36, 1), top 1180ms cubic-bezier(0.22, 1, 0.36, 1), transform 1180ms cubic-bezier(0.22, 1, 0.36, 1), opacity 1180ms ease;
      animation: falling-star-wiggle 260ms ease-in-out infinite alternate, falling-star-sparkle 520ms ease-in-out infinite;
    }

    .floating-star.is-dropping {
      transform: translate(-50%, -50%) scale(0.86) rotate(540deg);
    }

    .party-mode .hero,
    .party-mode .card,
    .party-mode .topbar,
    .party-mode .problem-text,
    .party-mode .problem-answers,
    .party-mode .star-bank-section {
      animation: party-sway 860ms ease-in-out infinite alternate;
      transform-origin: center;
    }

    .party-star {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 50;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      font-size: 2.25rem;
      line-height: 1;
      pointer-events: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.98)) drop-shadow(0 0 18px rgba(250, 204, 21, 0.82));
      animation: party-star-twinkle 420ms ease-in-out infinite alternate;
      will-change: left, top, transform;
    }

    .party-star.returning {
      transition: left 980ms cubic-bezier(0.22, 1, 0.36, 1), top 980ms cubic-bezier(0.22, 1, 0.36, 1), transform 980ms cubic-bezier(0.22, 1, 0.36, 1), opacity 980ms ease;
      transform: translate(-50%, -50%) scale(0.88);
    }

    .star-token.return-slot {
      opacity: 0;
      animation: none;
    }

    .problem-text {
      display: table-cell;
      font-size: clamp(1.2rem, 6vw, 2.8rem);
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-align: right;
      white-space: nowrap;
      padding-right: 6px;
      vertical-align: middle;
    }

    .answers-cell {
      display: table-cell;
      width: clamp(132px, 36vw, 240px);
      padding-left: clamp(8px, 2.5vw, 18px);
      vertical-align: middle;
    }

    .problem-answers {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
    }

    .answer-button {
      position: relative;
      min-height: clamp(34px, 10vw, 52px);
      width: 100%;
      border: none;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.15)),
        var(--button-color, #fca5a5);
      box-shadow: 0 8px 0 rgba(255, 255, 255, 0.7), 0 12px 22px rgba(31, 41, 55, 0.16);
      color: #0f172a;
      cursor: pointer;
      font-family: inherit;
      font-size: clamp(1.15rem, 4.8vw, 2rem);
      font-weight: 900;
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease, background 120ms ease;
      overflow: visible;
    }

    .answer-button:active {
      transform: translateY(5px) scale(0.98);
      box-shadow: 0 3px 0 rgba(255, 255, 255, 0.75), 0 8px 14px rgba(31, 41, 55, 0.18);
    }

    .answer-button:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.92);
      outline-offset: 3px;
    }

    .answer-button.correct {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.18)), #86efac;
      color: #14532d;
    }

    .answer-button.wrong {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.18)), #fca5a5;
      color: #7f1d1d;
      animation: wrong-shake 360ms ease;
    }

    .answer-button.correct {
      animation: correct-dance 700ms ease;
      transform-origin: center;
      z-index: 2;
    }

    .answer-button.sparkle-burst .sparkle {
      animation: sparkle-burst 620ms ease-out forwards;
    }

    .sparkle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      margin-top: -7px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, currentColor 45%, rgba(255, 255, 255, 0) 70%);
      opacity: 0;
      pointer-events: none;
      transform: rotate(var(--angle)) translateY(0) scale(0.2);
      color: var(--sparkle-color, #facc15);
    }

    .status {
      min-height: 1.6em;
      margin: 16px 0 0;
      text-align: center;
      font-size: clamp(1rem, 3.8vw, 1.15rem);
      font-weight: 800;
    }

    .status.good {
      color: var(--good);
    }

    .status.bad {
      color: var(--bad);
    }

    .hint {
      margin: 8px 0 0;
      text-align: center;
      font-size: clamp(0.95rem, 3.4vw, 1.05rem);
      line-height: 1.35;
      font-weight: 700;
    }

    @keyframes wrong-shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-10px) rotate(-3deg); }
      40% { transform: translateX(10px) rotate(3deg); }
      60% { transform: translateX(-8px) rotate(-2deg); }
      80% { transform: translateX(8px) rotate(2deg); }
      100% { transform: translateX(0); }
    }

    @keyframes correct-dance {
      0% { transform: scale(1); }
      18% { transform: scale(1.18) rotate(-7deg); }
      36% { transform: scale(1.26) rotate(7deg); }
      54% { transform: scale(1.2) rotate(-5deg); }
      72% { transform: scale(1.1) rotate(4deg); }
      100% { transform: scale(1.12) rotate(0deg); }
    }

    @keyframes sparkle-burst {
      0% {
        opacity: 0.2;
        transform: rotate(var(--angle)) translateY(0) scale(0.2);
      }
      25% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: rotate(var(--angle)) translateY(-64px) scale(1.1);
      }
    }

    @keyframes bank-star-dance {
      0% { transform: translateX(-1px) rotate(-4deg) translateY(0); }
      50% { transform: translateX(1px) rotate(4deg) translateY(-3px); }
      100% { transform: translateX(-1px) rotate(-4deg) translateY(0); }
    }

    @keyframes falling-star-wiggle {
      0% { margin-left: -2px; }
      100% { margin-left: 2px; }
    }

    @keyframes falling-star-sparkle {
      0% { opacity: 0.9; }
      50% { opacity: 1; }
      100% { opacity: 0.86; }
    }

    @keyframes party-sway {
      0% { transform: translateX(-3px) rotate(-1.4deg); }
      100% { transform: translateX(3px) rotate(1.4deg); }
    }

    @keyframes party-star-twinkle {
      0% { transform: translate(-50%, -50%) scale(0.96) rotate(-8deg); opacity: 0.92; }
      100% { transform: translate(-50%, -50%) scale(1.08) rotate(8deg); opacity: 1; }
    }

    @media (max-width: 420px) {
      .page {
        padding-left: 10px;
        padding-right: 10px;
      }

      .card {
        padding: 16px 10px;
        border-radius: 24px;
      }

      .answers-cell {
        width: 132px;
        padding-left: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a class="back-link" href="../index.html" aria-label="Back to home page">⬅️🏡</a>
    </div>
    <header class="hero">
      <h1 class="title">Math</h1>
      <p class="subtitle">toán học</p>
    </header>
    <section class="card">
      <div class="problems-stack" id="problems-stack" aria-label="Three math problems"></div>
      <p class="status" id="status"></p>
    </section>
    <section class="star-bank-section" aria-label="Collected stars">
      <div class="star-bank-label">Star Parade</div>
      <div class="stars-bank" id="stars-bank"></div>
    </section>
  </main>

  <script>
    const appVersion = "20261108031344";
    const versionInfoPath = "../app_version.json";
    const mathConfig = {
  "base_max_number": 10,
  "base_min_number": 0,
  "problems_per_round": 3,
  "star_max_boost": 1,
  "star_min_boost": 0,
  "correct_answer": "../assets/audio/UI_Sounds/ding%20sparkle.m4a?v=20261017-2",
  "wrong_answer": "../assets/audio/UI_Sounds/Uuugh.m4a?v=20261017-2",
  "star_celebration": "../assets/audio/UI_Sounds/Magic%20ga.m4a?v=20261017-2",
  "star_party": "../assets/audio/UI_Sounds/rocket-road.m4a?v=20261017-2"
};
    const problemsStack = document.getElementById("problems-stack");
    const statusElement = document.getElementById("status");
    const backLink = document.querySelector(".back-link");
    const starsBank = document.getElementById("stars-bank");
    const palette = ["#fcd34d", "#93c5fd", "#f9a8d4"];
    const sparklePalette = ["#facc15", "#fb7185", "#60a5fa", "#34d399", "#c084fc"];
    const navigationPlayer = new Audio("../assets/audio/Menu/Back%20to%20home.m4a");
    const uiPlayer = new Audio();
    const magicPlayer = new Audio();
    const partyPlayer = new Audio();
    const correctAudio = mathConfig.correct_answer;
    const wrongAudio = mathConfig.wrong_answer;
    const magicAudio = mathConfig.star_celebration;
    const partyAudio = mathConfig.star_party;
    const problemsPerRound = Math.max(1, Number(mathConfig.problems_per_round) || 3);
    let currentProblems = [];
    let solvedProblemIndexes = new Set();
    let isPerfectRound = true;
    let isResolving = false;
    let activeResolutionId = 0;
    let isPartyLockActive = false;
    let partyAnimationFrame = null;
    let flyingPartyStars = [];

    function withVersion(href, version = appVersion) {
      const url = new URL(href, window.location.href);
      url.searchParams.set("v", version);
      return url.toString();
    }

    async function ensureLatestVersion() {
      try {
        const response = await fetch(`${versionInfoPath}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          return;
        }

        const latest = await response.json();
        if (!latest.version || latest.version === appVersion) {
          return;
        }

        window.location.replace(withVersion(window.location.pathname + window.location.search + window.location.hash, latest.version));
      } catch (error) {
        console.error("Unable to check app version", error);
      }
    }

    async function playThenNavigate(audioPath, href) {
      if (isPartyLockActive) {
        return;
      }

      const destination = withVersion(href);
      if (!audioPath) {
        window.location.href = destination;
        return;
      }

      navigationPlayer.pause();
      navigationPlayer.currentTime = 0;
      navigationPlayer.src = audioPath;

      try {
        await navigationPlayer.play();
        navigationPlayer.addEventListener(
          "ended",
          () => {
            window.location.href = destination;
          },
          { once: true }
        );
      } catch (error) {
        console.error("Unable to play back audio", error);
        window.location.href = destination;
      }
    }

    void ensureLatestVersion();

    async function playSound(audioPath, waitForEnd = false) {
      if (!audioPath) {
        return;
      }

      uiPlayer.pause();
      uiPlayer.currentTime = 0;
      uiPlayer.src = audioPath;

      try {
        await uiPlayer.play();
        if (waitForEnd) {
          await new Promise((resolve) => {
            uiPlayer.addEventListener("ended", resolve, { once: true });
          });
        }
      } catch (error) {
        console.error("Unable to play UI audio", error);
      }
    }

    async function playMagicSound() {
      if (!magicAudio) {
        return;
      }

      magicPlayer.pause();
      magicPlayer.currentTime = 0;
      magicPlayer.src = magicAudio;

      try {
        await magicPlayer.play();
        await new Promise((resolve) => {
          magicPlayer.addEventListener("ended", resolve, { once: true });
        });
      } catch (error) {
        console.error("Unable to play magic audio", error);
      }
    }

    function stopMagicSound() {
      magicPlayer.pause();
      magicPlayer.currentTime = 0;
    }

    async function getAudioDuration(audioPath) {
      if (!audioPath) {
        return 0;
      }

      return await new Promise((resolve) => {
        const probe = new Audio();
        const finish = (value) => {
          probe.src = "";
          resolve(value);
        };

        probe.preload = "metadata";
        probe.src = audioPath;
        if (probe.readyState >= 1 && Number.isFinite(probe.duration)) {
          finish(probe.duration);
          return;
        }

        probe.addEventListener(
          "loadedmetadata",
          () => {
            finish(Number.isFinite(probe.duration) ? probe.duration : 0);
          },
          { once: true }
        );
        probe.addEventListener("error", () => finish(0), { once: true });
      });
    }

    async function playPartySound() {
      if (!partyAudio) {
        return;
      }

      partyPlayer.pause();
      partyPlayer.currentTime = 0;
      partyPlayer.src = partyAudio;

      try {
        await partyPlayer.play();
        await new Promise((resolve) => {
          partyPlayer.addEventListener("ended", resolve, { once: true });
        });
      } catch (error) {
        console.error("Unable to play party audio", error);
      }
    }

    function wait(ms) {
      return new Promise((resolve) => {
        window.setTimeout(resolve, ms);
      });
    }

    function addBankPlaceholder() {
      const placeholder = document.createElement("span");
      placeholder.className = "star-token placeholder";
      placeholder.textContent = "⭐";
      starsBank.appendChild(placeholder);
      return placeholder;
    }

    function finalizeBankStar(placeholder) {
      placeholder.classList.remove("placeholder");
      placeholder.style.setProperty("--dance-delay", `${(starsBank.children.length - 1) * 90}ms`);
    }

    function getVisibleStarTokens() {
      return [...starsBank.querySelectorAll(".star-token:not(.placeholder):not(.return-slot)")];
    }

    function animateBankCompaction(removedToken, durationMs) {
      const tokens = getVisibleStarTokens();
      const beforeRects = new Map(tokens.map((token) => [token, token.getBoundingClientRect()]));
      removedToken.remove();
      getVisibleStarTokens().forEach((token) => {
        const beforeRect = beforeRects.get(token);
        const afterRect = token.getBoundingClientRect();
        const dx = beforeRect.left - afterRect.left;
        const dy = beforeRect.top - afterRect.top;
        if (dx === 0 && dy === 0) {
          return;
        }

        token.animate(
          [
            { transform: `translate(${dx}px, ${dy}px)` },
            { transform: "translate(0, 0)" },
          ],
          {
            duration: durationMs,
            easing: "cubic-bezier(0.22, 1, 0.36, 1)",
            fill: "both",
          }
        );
      });
    }

    function createPartyStarFromToken(token) {
      const rect = token.getBoundingClientRect();
      const star = document.createElement("span");
      star.className = "party-star";
      star.textContent = "⭐";
      document.body.appendChild(star);

      const angle = Math.random() * Math.PI * 2;
      const speed = 220 * (0.8 + Math.random() * 0.4);

      return {
        element: star,
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: Math.max(rect.width, 40),
      };
    }

    function renderPartyStar(star) {
      star.element.style.left = `${star.x}px`;
      star.element.style.top = `${star.y}px`;
    }

    function startPartyPhysics() {
      let lastTime = performance.now();

      const step = (now) => {
        const dt = Math.min((now - lastTime) / 1000, 0.04);
        lastTime = now;
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        flyingPartyStars.forEach((star) => {
          star.x += star.vx * dt;
          star.y += star.vy * dt;

          const half = star.size / 2;
          if (star.x <= half) {
            star.x = half;
            star.vx = Math.abs(star.vx);
          } else if (star.x >= viewportWidth - half) {
            star.x = viewportWidth - half;
            star.vx = -Math.abs(star.vx);
          }

          if (star.y <= half) {
            star.y = half;
            star.vy = Math.abs(star.vy);
          } else if (star.y >= viewportHeight - half) {
            star.y = viewportHeight - half;
            star.vy = -Math.abs(star.vy);
          }

          renderPartyStar(star);
        });

        partyAnimationFrame = window.requestAnimationFrame(step);
      };

      if (partyAnimationFrame) {
        window.cancelAnimationFrame(partyAnimationFrame);
      }
      partyAnimationFrame = window.requestAnimationFrame(step);
    }

    function stopPartyPhysics() {
      if (partyAnimationFrame) {
        window.cancelAnimationFrame(partyAnimationFrame);
        partyAnimationFrame = null;
      }
    }

    function createReturnSlots(count) {
      const slots = [];
      for (let index = 0; index < count; index += 1) {
        const slot = document.createElement("span");
        slot.className = "star-token return-slot";
        slot.textContent = "⭐";
        starsBank.appendChild(slot);
        slots.push(slot);
      }
      return slots;
    }

    async function returnPartyStars(slots) {
      const animations = flyingPartyStars.map((star, index) => {
        const slot = slots[index];
        const rect = slot.getBoundingClientRect();
        return new Promise((resolve) => {
          let settled = false;
          const finish = () => {
            if (settled) {
              return;
            }
            settled = true;
            resolve();
          };

          star.element.addEventListener("transitionend", finish, { once: true });
          window.setTimeout(finish, 1100);
          star.element.classList.add("returning");
          star.element.style.left = `${rect.left + rect.width / 2}px`;
          star.element.style.top = `${rect.top + rect.height / 2}px`;
        });
      });

      await Promise.all(animations);

      flyingPartyStars.forEach((star) => {
        star.element.remove();
      });
      flyingPartyStars = [];

      slots.forEach((slot, index) => {
        slot.classList.remove("return-slot");
        slot.style.setProperty("--dance-delay", `${index * 90}ms`);
      });
    }

    async function runStarParty() {
      const starCount = getStarCount();
      if (!partyAudio || starCount === 0) {
        return;
      }

      document.body.classList.add("party-mode");
      const totalDurationMs = Math.max(await getAudioDuration(partyAudio) * 1000, 1000);
      const intervalMs = starCount > 1 ? totalDurationMs / (starCount + 2) : totalDurationMs;
      const compactionDuration = Math.max(90, Math.min(540, intervalMs * 0.78));
      const playback = playPartySound();

      startPartyPhysics();

      for (let index = 0; index < starCount; index += 1) {
        const token = getVisibleStarTokens()[0];
        if (!token) {
          break;
        }

        const partyStar = createPartyStarFromToken(token);
        flyingPartyStars.push(partyStar);
        renderPartyStar(partyStar);
        animateBankCompaction(token, compactionDuration);

        if (index < starCount - 1) {
          await wait(intervalMs);
        }
      }

      await playback;
      stopPartyPhysics();

      const slots = createReturnSlots(starCount);
      await new Promise((resolve) => requestAnimationFrame(resolve));
      await returnPartyStars(slots);
      document.body.classList.remove("party-mode");
    }

    async function celebrateMilestone(sourceElement) {
      const placeholder = addBankPlaceholder();
      const startRect = sourceElement.getBoundingClientRect();
      const endRect = placeholder.getBoundingClientRect();
      const floatingStar = document.createElement("span");
      floatingStar.className = "floating-star";
      floatingStar.textContent = "⭐";
      floatingStar.style.left = `${startRect.left + startRect.width / 2}px`;
      floatingStar.style.top = `${startRect.top + startRect.height / 2}px`;
      document.body.appendChild(floatingStar);

      const animationPromise = new Promise((resolve) => {
        let settled = false;
        const finish = () => {
          if (settled) {
            return;
          }
          settled = true;
          resolve();
        };

        floatingStar.addEventListener("transitionend", finish, { once: true });
        window.setTimeout(finish, 1300);
      });

      requestAnimationFrame(() => {
        floatingStar.classList.add("is-dropping");
        floatingStar.style.left = `${endRect.left + endRect.width / 2}px`;
        floatingStar.style.top = `${endRect.top + endRect.height / 2}px`;
      });

      const magicPlayback = playMagicSound();
      await animationPromise;
      floatingStar.remove();
      finalizeBankStar(placeholder);
      const totalStars = getStarCount();
      await magicPlayback;
      await wait(120);
      return totalStars;
    }

    function playWrongSound() {
      return playSound(wrongAudio, true);
    }

    function playCorrectSound() {
      return playSound(correctAudio, true);
    }

    backLink.addEventListener("click", (event) => {
      event.preventDefault();
      playThenNavigate("../assets/audio/Menu/Back%20to%20home.m4a", backLink.getAttribute("href"));
    });

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = randomInt(0, index);
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }

    function getStarCount() {
      return starsBank.querySelectorAll(".star-token:not(.placeholder)").length;
    }

    function getDifficultyBounds() {
      const starCount = getStarCount();
      const minNumber = mathConfig.base_min_number + starCount * mathConfig.star_min_boost;
      const maxNumber = mathConfig.base_max_number + starCount * mathConfig.star_max_boost;
      return {
        minNumber,
        maxNumber: Math.max(minNumber + 1, maxNumber),
      };
    }

    function buildProblem() {
      const { minNumber, maxNumber } = getDifficultyBounds();
      const problemBuilders = [];

      if (minNumber <= maxNumber - minNumber) {
        problemBuilders.push(() => {
          const left = randomInt(minNumber, maxNumber - minNumber);
          const right = randomInt(minNumber, maxNumber - left);
          return {
            text: `${left} + ${right} =`,
            correctAnswer: left + right,
          };
        });

        problemBuilders.push(() => {
          const correctAnswer = randomInt(minNumber, maxNumber - minNumber);
          const right = randomInt(minNumber, maxNumber - correctAnswer);
          return {
            text: `${correctAnswer + right} - ${right} =`,
            correctAnswer,
          };
        });
      }

      if (problemBuilders.length === 0) {
        throw new Error(`No valid math problems for bounds ${minNumber}-${maxNumber}`);
      }

      const { text, correctAnswer } = problemBuilders[randomInt(0, problemBuilders.length - 1)]();
      const choices = new Set([correctAnswer]);

      for (const offset of shuffle([-3, -2, -1, 1, 2, 3])) {
        const wrongAnswer = correctAnswer + offset;
        if (wrongAnswer < minNumber || wrongAnswer > maxNumber) {
          continue;
        }
        choices.add(wrongAnswer);
        if (choices.size === 3) {
          break;
        }
      }

      if (choices.size < 3) {
        for (const value of shuffle([...Array(maxNumber - minNumber + 1).keys()].map((offset) => minNumber + offset))) {
          if (value !== correctAnswer) {
            choices.add(value);
          }
          if (choices.size === 3) {
            break;
          }
        }
      }

      const answers = shuffle([...choices]);

      return {
        text,
        correctAnswer,
        answers,
      };
    }

    function setStatus(message, tone) {
      statusElement.textContent = message;
      statusElement.className = tone ? `status ${tone}` : "status";
    }

    function applyInteractionLock() {
      problemsStack.querySelectorAll(".answer-button").forEach((button) => {
        button.disabled = isPartyLockActive;
      });
      backLink.setAttribute("aria-disabled", String(isPartyLockActive));
    }

    function setPartyInteractionLock(locked) {
      isPartyLockActive = locked;
      applyInteractionLock();
    }

    function renderRound() {
      currentProblems = Array.from({ length: problemsPerRound }, () => buildProblem());
      solvedProblemIndexes = new Set();
      isPerfectRound = true;
      problemsStack.replaceChildren();
      setStatus("Solve all three problems!", "");

      currentProblems.forEach((problem, problemIndex) => {
        const row = document.createElement("div");
        const problemText = document.createElement("div");
        const answersCell = document.createElement("div");
        const answers = document.createElement("div");

        row.className = "problem-row";
        problemText.className = "problem-text";
        problemText.textContent = problem.text;
        answersCell.className = "answers-cell";
        answers.className = "problem-answers";

        problem.answers.forEach((answer, answerIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "answer-button";
          button.textContent = answer;
          button.style.setProperty("--button-color", palette[answerIndex % palette.length]);
          button.setAttribute("aria-label", `Answer ${answer} for ${problem.text}`);
          button.addEventListener("click", () => { void handleAnswer(button, answer, problemIndex); });
          answers.appendChild(button);
        });

        answersCell.appendChild(answers);
        row.append(problemText, answersCell);
        problemsStack.appendChild(row);
      });

      applyInteractionLock();
    }

    function burstSparkles(button) {
      button.classList.remove("sparkle-burst");
      button.querySelectorAll(".sparkle").forEach((sparkle) => sparkle.remove());

      for (let index = 0; index < 8; index += 1) {
        const sparkle = document.createElement("span");
        sparkle.className = "sparkle";
        sparkle.style.setProperty("--angle", `${index * 45}deg`);
        sparkle.style.setProperty(
          "--sparkle-color",
          sparklePalette[index % sparklePalette.length]
        );
        button.appendChild(sparkle);
      }

      button.classList.add("sparkle-burst");
      window.setTimeout(() => {
        button.classList.remove("sparkle-burst");
        button.querySelectorAll(".sparkle").forEach((sparkle) => sparkle.remove());
      }, 650);
    }

    async function handleAnswer(button, answer, problemIndex) {
      if (isResolving || isPartyLockActive || button.disabled) {
        return;
      }

      stopMagicSound();
      const resolutionId = ++activeResolutionId;
      const problem = currentProblems[problemIndex];
      const buttons = [...button.parentElement.querySelectorAll(".answer-button")];
      if (answer === problem.correctAnswer) {
        isResolving = true;
        button.classList.add("correct");
        burstSparkles(button);
        setStatus("Great job!", "good");
        buttons.forEach((item) => {
          item.disabled = true;
        });
        await playCorrectSound();
        if (resolutionId !== activeResolutionId) {
          return;
        }

        solvedProblemIndexes.add(problemIndex);
        if (solvedProblemIndexes.size < currentProblems.length) {
          setStatus(`${solvedProblemIndexes.size} of ${currentProblems.length} solved!`, "good");
          isResolving = false;
          return;
        }

        if (!isPerfectRound) {
          setStatus("Round complete! Try for a perfect round next time.", "");
          await wait(850);
          if (resolutionId === activeResolutionId) {
            isResolving = false;
            renderRound();
          }
          return;
        }

        setStatus("Perfect round! Star earned!", "good");
        const willTriggerParty = (getStarCount() + 1) % 7 === 0;
        if (willTriggerParty) {
          setPartyInteractionLock(true);
        }
        const totalStars = await celebrateMilestone(button);
        if (resolutionId !== activeResolutionId) {
          return;
        }
        if (willTriggerParty && totalStars > 0 && totalStars % 7 === 0) {
          setStatus("Star party!", "good");
          await runStarParty();
        }
        if (willTriggerParty) {
          setPartyInteractionLock(false);
        }
        isResolving = false;
        renderRound();
        return;
      }

      isResolving = true;
      isPerfectRound = false;
      button.classList.remove("wrong");
      void button.offsetWidth;
      button.classList.add("wrong");
      button.disabled = true;
      setStatus("Try another answer!", "bad");
      await playWrongSound();
      if (resolutionId === activeResolutionId) {
        isResolving = false;
      }
    }

    renderRound();
  </script>
</body>
