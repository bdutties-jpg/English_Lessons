  <style>
    :root {
      --ink: #1f2937;
      --shadow: rgba(31, 41, 55, 0.18);
      --health-off: #94a3b8;
      --health-on: #f97316;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Trebuchet MS", "Comic Sans MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 12%, rgba(255, 255, 255, 0.82), transparent 25%),
        radial-gradient(circle at 87% 20%, rgba(255, 255, 255, 0.7), transparent 22%),
        linear-gradient(180deg, #c4b5fd 0%, #93c5fd 48%, #fde68a 100%);
    }

    .page {
      width: min(100%, 960px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .topbar { margin-bottom: 12px; }

    .back-link {
      display: inline-flex;
      align-items: center;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 6px 18px rgba(31, 41, 55, 0.12);
      color: #0f172a;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 800;
    }

    .back-link:focus-visible,
    .vocabulary-button:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.92);
      outline-offset: 3px;
    }

    .hero { margin: 18px 0 24px; text-align: center; }

    .title {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 4rem);
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #0f172a;
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.65);
    }

    .subtitle {
      margin: 12px auto 0;
      max-width: 34rem;
      font-size: clamp(1rem, 3.6vw, 1.25rem);
      font-weight: 800;
      line-height: 1.35;
    }

    .game-card {
      max-width: 760px;
      margin: 0 auto;
      padding: clamp(16px, 4vw, 28px);
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 16px 32px var(--shadow);
      backdrop-filter: blur(6px);
    }

    .vocabulary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(10px, 2.5vw, 20px);
      align-items: end;
    }

    .vocabulary-tile {
      min-width: 0;
      display: grid;
      justify-items: center;
      gap: 10px;
    }

    .health-stack {
      display: flex;
      flex-direction: column-reverse;
      gap: 5px;
      width: min(100%, 104px);
    }

    .health-segment {
      position: relative;
      display: block;
      height: clamp(10px, 2.8vw, 15px);
      border: 2px solid rgba(15, 23, 42, 0.24);
      border-radius: 999px;
      background: var(--health-off);
      box-shadow: inset 0 2px 2px rgba(255, 255, 255, 0.35), 0 2px 0 rgba(15, 23, 42, 0.1);
      transition: background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
      overflow: visible;
    }

    .health-segment.lit {
      background: linear-gradient(180deg, #fed7aa, var(--health-on));
      border-color: #ea580c;
      box-shadow: 0 0 13px rgba(249, 115, 22, 0.82), inset 0 2px 2px rgba(255, 255, 255, 0.7);
      transform: scaleX(1.05);
    }

    .vocabulary-button {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 1;
      padding: 4px;
      border: 4px solid rgba(255, 255, 255, 0.84);
      border-radius: clamp(18px, 4vw, 28px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.18)), var(--tile-color, #fcd34d);
      box-shadow: 0 10px 0 rgba(255, 255, 255, 0.64), 0 15px 28px var(--shadow);
      color: #0f172a;
      cursor: pointer;
      font-size: clamp(2.4rem, 10vw, 5.2rem);
      line-height: 1;
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
      overflow: visible;
    }

    .vocabulary-button:active:not(:disabled) {
      transform: translateY(5px) scale(0.98);
      box-shadow: 0 4px 0 rgba(255, 255, 255, 0.72), 0 8px 16px var(--shadow);
    }

    .vocabulary-button:disabled { cursor: wait; filter: saturate(0.86); }

    .charge-sparkle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      margin: -6px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0 25%, var(--sparkle-color, #fde047) 43%, rgba(255, 255, 255, 0) 72%);
      pointer-events: none;
      animation: charge-sparkle 620ms ease-out forwards;
    }

    .star-bank-section { margin-top: 24px; padding: 14px 10px 4px; }

    .star-bank-label {
      margin-bottom: 8px;
      font-size: clamp(0.95rem, 3.4vw, 1.05rem);
      font-weight: 900;
      color: #475569;
      letter-spacing: 0.03em;
    }

    .stars-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      min-height: 58px;
    }

    .star-token {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      font-size: 2rem;
      line-height: 1;
      filter: drop-shadow(0 5px 10px rgba(250, 204, 21, 0.45));
      animation: bank-star-dance 1700ms ease-in-out infinite;
      animation-delay: var(--dance-delay, 0ms);
    }

    .star-token.placeholder, .star-token.return-slot { opacity: 0; animation: none; }

    .floating-star, .party-star {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 40;
      font-size: 2.3rem;
      line-height: 1;
      pointer-events: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 9px rgba(255, 255, 255, 0.98)) drop-shadow(0 0 18px rgba(250, 204, 21, 0.75));
    }

    .floating-star {
      transition: left 1180ms cubic-bezier(0.22, 1, 0.36, 1), top 1180ms cubic-bezier(0.22, 1, 0.36, 1), transform 1180ms cubic-bezier(0.22, 1, 0.36, 1);
      animation: falling-star-wiggle 260ms ease-in-out infinite alternate;
    }

    .floating-star.is-dropping { transform: translate(-50%, -50%) scale(0.86) rotate(540deg); }
    .party-star { z-index: 50; width: 44px; height: 44px; display: grid; place-items: center; animation: party-star-twinkle 420ms ease-in-out infinite alternate; }
    .party-star.returning { transition: left 980ms cubic-bezier(0.22, 1, 0.36, 1), top 980ms cubic-bezier(0.22, 1, 0.36, 1), transform 980ms cubic-bezier(0.22, 1, 0.36, 1), opacity 980ms ease; transform: translate(-50%, -50%) scale(0.88); }

    .party-mode .hero, .party-mode .game-card, .party-mode .topbar, .party-mode .star-bank-section { animation: party-sway 860ms ease-in-out infinite alternate; transform-origin: center; }

    @keyframes charge-sparkle {
      from { opacity: 1; transform: rotate(var(--angle)) translateY(0) scale(0.45); }
      to { opacity: 0; transform: rotate(var(--angle)) translateY(-72px) scale(1.25); }
    }

    @keyframes bank-star-dance {
      0% { transform: translateX(-1px) rotate(-4deg) translateY(0); }
      50% { transform: translateX(1px) rotate(4deg) translateY(-3px); }
      100% { transform: translateX(-1px) rotate(-4deg) translateY(0); }
    }

    @keyframes falling-star-wiggle { from { margin-left: -2px; } to { margin-left: 2px; } }
    @keyframes party-sway { from { transform: rotate(-1.6deg) scale(1); } to { transform: rotate(1.6deg) scale(1.02); } }
    @keyframes party-star-twinkle { from { transform: translate(-50%, -50%) scale(0.92) rotate(-10deg); } to { transform: translate(-50%, -50%) scale(1.12) rotate(10deg); } }

    @media (max-width: 480px) {
      .page { padding-left: 10px; padding-right: 10px; }
      .game-card { padding: 14px 10px 18px; }
      .vocabulary-grid { gap: 8px; }
      .health-stack { gap: 3px; }
    }
  </style>

    const sparklePalette = ["#fde047", "#fb7185", "#60a5fa", "#34d399", "#c084fc"];
    const buttonsPerRound = Math.max(1, Number(vocabularyConfig.buttons_per_round) || 4);
    const chargesPerButton = Math.max(1, Number(vocabularyConfig.charges_per_button) || 3);
    let tiles = [];

    function withVersion(href, version = appVersion) {
      const url = new URL(href, window.location.href);
      url.searchParams.set("v", version);
      return url.toString();
    }

    async function ensureLatestVersion() {
      try {
        const response = await fetch(`${versionInfoPath}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) return;
        const latest = await response.json();
        if (latest.version && latest.version !== appVersion) {
          window.location.replace(withVersion(window.location.pathname + window.location.search + window.location.hash, latest.version));
        }
      } catch (error) {
        console.error("Unable to check app version", error);
      }
    }

    function wait(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    function shuffle(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }

    async function playAudio(player, audioPath, waitForEnd = false) {
      if (!audioPath) return;
      player.pause();
      player.currentTime = 0;
      player.src = audioPath;
      try {
        await player.play();
        if (waitForEnd) {
          await new Promise((resolve) => {
            const finish = () => resolve();
            player.addEventListener("ended", finish, { once: true });
            player.addEventListener("error", finish, { once: true });
          });
        }
      } catch (error) {
        console.error("Unable to play audio", error);
      }
    }

    async function playThenNavigate(audioPath, href) {
      if (isCelebrating) return;
      const destination = withVersion(href);
      if (!audioPath) {
        window.location.href = destination;
        return;
      }
      await playAudio(navigationPlayer, audioPath, true);
      window.location.href = destination;
    }

    function burstSparkles(segment) {
      for (let index = 0; index < 10; index += 1) {
        const sparkle = document.createElement("span");
        sparkle.className = "charge-sparkle";
        sparkle.style.setProperty("--angle", `${index * 36}deg`);
        sparkle.style.setProperty("--sparkle-color", sparklePalette[index % sparklePalette.length]);
        segment.appendChild(sparkle);
        sparkle.addEventListener("animationend", () => sparkle.remove(), { once: true });
      }
    }

    function createRoundTiles() {
      const vocabulary = pageConfig.vocabulary || [];
      if (!vocabulary.length) return [];
      const uniqueItems = shuffle(vocabulary).slice(0, Math.min(buttonsPerRound, vocabulary.length));
      const items = [...uniqueItems];
      while (items.length < buttonsPerRound) {
        items.push(vocabulary[Math.floor(Math.random() * vocabulary.length)]);
      }
      return items.map((item, index) => ({ item, index, charges: 0, isPlaying: false, button: null }));
    }

    function renderRound() {
      tiles = createRoundTiles();
      vocabularyGrid.replaceChildren();
      tiles.forEach((tile) => {
        const wrapper = document.createElement("div");
        const healthStack = document.createElement("div");
        const button = document.createElement("button");
        wrapper.className = "vocabulary-tile";
        healthStack.className = "health-stack";
        for (let index = 0; index < chargesPerButton; index += 1) {
          const segment = document.createElement("span");
          segment.className = "health-segment";
          healthStack.appendChild(segment);
        }
        button.type = "button";
        button.className = "vocabulary-button";
        button.style.setProperty("--tile-color", tilePalette[tile.index % tilePalette.length]);
        button.textContent = tile.item.emoji;
        button.setAttribute("aria-label", tile.item.word);
        button.addEventListener("click", () => { void handleTilePress(tile); });
        tile.button = button;
        wrapper.append(healthStack, button);
        vocabularyGrid.appendChild(wrapper);
      });
    }

    function allTilesCharged() {
      return tiles.length > 0 && tiles.every((tile) => tile.charges >= chargesPerButton);
    }

    async function handleTilePress(tile) {
      if (isCelebrating || tile.isPlaying) return;
      tile.isPlaying = true;
      tile.button.disabled = true;
      await playAudio(wordPlayer, tile.item.audio, true);

      if (tile.charges < chargesPerButton) {
        tile.charges += 1;
        const segment = tile.button.parentElement.querySelectorAll(".health-segment")[tile.charges - 1];
        segment.classList.add("lit");
        burstSparkles(segment);
        void playAudio(chargePlayer, vocabularyConfig.charge_sound);
        await wait(650);
      }

      tile.isPlaying = false;
      tile.button.disabled = false;
      if (allTilesCharged()) {
        await completeRound(tile.button);
      }
    }

    function addBankPlaceholder() {
      const placeholder = document.createElement("span");
      placeholder.className = "star-token placeholder";
      placeholder.textContent = "⭐";
      starsBank.appendChild(placeholder);
      return placeholder;
    }

    function finalizeBankStar(placeholder) {
      placeholder.classList.remove("placeholder");
      placeholder.style.setProperty("--dance-delay", `${(starsBank.children.length - 1) * 90}ms`);
    }

    function getVisibleStarTokens() {
      return [...starsBank.querySelectorAll(".star-token:not(.placeholder):not(.return-slot)")];
    }

    function getStarCount() {
      return starsBank.querySelectorAll(".star-token:not(.placeholder)").length;
    }

    async function celebrateMilestone(sourceButton) {
      const placeholder = addBankPlaceholder();
      const startRect = sourceButton.getBoundingClientRect();
      const endRect = placeholder.getBoundingClientRect();
      const floatingStar = document.createElement("span");
      floatingStar.className = "floating-star";
      floatingStar.textContent = "⭐";
      floatingStar.style.left = `${startRect.left + startRect.width / 2}px`;
      floatingStar.style.top = `${startRect.top + startRect.height / 2}px`;
      document.body.appendChild(floatingStar);
      const animation = new Promise((resolve) => {
        floatingStar.addEventListener("transitionend", resolve, { once: true });
        window.setTimeout(resolve, 1300);
      });
      requestAnimationFrame(() => {
        floatingStar.classList.add("is-dropping");
        floatingStar.style.left = `${endRect.left + endRect.width / 2}px`;
        floatingStar.style.top = `${endRect.top + endRect.height / 2}px`;
      });
      const magicPlayback = playAudio(magicPlayer, vocabularyConfig.star_celebration, true);
      await animation;
      floatingStar.remove();
      finalizeBankStar(placeholder);
      await magicPlayback;
      return getStarCount();
    }

    function createPartyStarFromToken(token) {
      const rect = token.getBoundingClientRect();
      const star = document.createElement("span");
      star.className = "party-star";
      star.textContent = "⭐";
      document.body.appendChild(star);
      const angle = Math.random() * Math.PI * 2;
      const speed = 220 * (0.8 + Math.random() * 0.4);
      return { element: star, x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size: Math.max(rect.width, 40) };
    }

    function startPartyPhysics() {
      let lastTime = performance.now();
      const step = (now) => {
        const dt = Math.min((now - lastTime) / 1000, 0.04);
        lastTime = now;
        flyingPartyStars.forEach((star) => {
          star.x += star.vx * dt;
          star.y += star.vy * dt;
          const half = star.size / 2;
          if (star.x <= half || star.x >= window.innerWidth - half) star.vx *= -1;
          if (star.y <= half || star.y >= window.innerHeight - half) star.vy *= -1;
          star.x = Math.max(half, Math.min(star.x, window.innerWidth - half));
          star.y = Math.max(half, Math.min(star.y, window.innerHeight - half));
          star.element.style.left = `${star.x}px`;
          star.element.style.top = `${star.y}px`;
        });
        partyAnimationFrame = requestAnimationFrame(step);
      };
      partyAnimationFrame = requestAnimationFrame(step);
    }

    function stopPartyPhysics() {
      if (partyAnimationFrame) cancelAnimationFrame(partyAnimationFrame);
      partyAnimationFrame = null;
    }

    async function runStarParty() {
      const tokens = getVisibleStarTokens();
      if (!tokens.length) return;
      document.body.classList.add("party-mode");
      const playback = playAudio(partyPlayer, vocabularyConfig.star_party, true);
      tokens.forEach((token) => {
        const star = createPartyStarFromToken(token);
        flyingPartyStars.push(star);
        star.element.style.left = `${star.x}px`;
        star.element.style.top = `${star.y}px`;
        token.remove();
      });
      startPartyPhysics();
      await Promise.race([playback, wait(5000)]);
      stopPartyPhysics();
      const returnSlots = flyingPartyStars.map(() => {
        const slot = document.createElement("span");
        slot.className = "star-token return-slot";
        slot.textContent = "⭐";
        starsBank.appendChild(slot);
        return slot;
      });
      await new Promise((resolve) => requestAnimationFrame(resolve));
      await Promise.all(flyingPartyStars.map((star, index) => new Promise((resolve) => {
        const rect = returnSlots[index].getBoundingClientRect();
        star.element.addEventListener("transitionend", resolve, { once: true });
        window.setTimeout(resolve, 1100);
        star.element.classList.add("returning");
        star.element.style.left = `${rect.left + rect.width / 2}px`;
        star.element.style.top = `${rect.top + rect.height / 2}px`;
      })));
      flyingPartyStars.forEach((star) => star.element.remove());
      flyingPartyStars = [];
      returnSlots.forEach((slot, index) => {
        slot.classList.remove("return-slot");
        slot.style.setProperty("--dance-delay", `${index * 90}ms`);
      });
      document.body.classList.remove("party-mode");
    }

    async function completeRound(sourceButton) {
      isCelebrating = true;
      tiles.forEach((tile) => { tile.button.disabled = true; });
      const starCount = await celebrateMilestone(sourceButton);
      if (starCount > 0 && starCount % 7 === 0) await runStarParty();
      await wait(180);
      isCelebrating = false;
      renderRound();
    }

    document.getElementById("page-title").textContent = pageConfig.title;
    document.getElementById("page-subtitle").textContent = pageConfig.subtitle;
    document.getElementById("page-description").textContent = pageConfig.description;
    backLink.addEventListener("click", (event) => {
      event.preventDefault();
      void playThenNavigate(pageConfig.backAudio, backLink.getAttribute("href"));
    });
    void ensureLatestVersion();
    renderRound();
  </script>
</body>
</html>
