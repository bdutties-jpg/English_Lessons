  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="English Playtime" />

  <meta name="theme-color" content="#f9a8d4" />

  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png" />

  <title>Reading</title>
  <style>
    :root {
      --ink: #1f2937;
      --good: #16a34a;
      --bad: #ef4444;
      --shadow: rgba(31, 41, 55, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Comic Sans MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.85), transparent 25%),
        radial-gradient(circle at top right, rgba(255, 255, 255, 0.7), transparent 20%),
        linear-gradient(180deg, #f9a8d4 0%, #93c5fd 45%, #fde68a 100%);
    }

    .page {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .topbar {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 6px 18px rgba(31, 41, 55, 0.12);
      color: #0f172a;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 800;
    }

    .back-link:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.85);
      outline-offset: 3px;
    }

    .hero {
      text-align: center;
      margin-top: 24px;
    }

    .title {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 4rem);
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #0f172a;
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.65);
    }

    .subtitle {
      margin: 12px auto 0;
      font-size: clamp(1.1rem, 4vw, 1.35rem);
      font-weight: 800;
    }

    .card {
      margin: 28px auto 0;
      max-width: 46rem;
      padding: 22px 16px 20px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 16px 32px var(--shadow);
      backdrop-filter: blur(6px);
    }

    .problem-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(90px, 112px) 74px;
      gap: 14px;
      align-items: center;
      justify-content: center;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
    }

    .game-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 74px;
      align-self: stretch;
      justify-content: center;
    }

    .goal-star-shell {
      position: relative;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 6px 10px rgba(31, 41, 55, 0.18));
    }

    .goal-star {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 2.45rem;
      line-height: 1;
      transition: opacity 240ms ease, transform 240ms ease, filter 240ms ease;
    }

    .goal-star-off {
      color: #d1d5db;
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.72);
    }

    .goal-star-on {
      color: #fde047;
      opacity: 0;
      transform: scale(0.72);
      text-shadow: 0 0 18px rgba(250, 204, 21, 0.92), 0 0 34px rgba(255, 255, 255, 0.92);
    }

    .goal-star-shell.lit .goal-star-on {
      opacity: 1;
      transform: scale(1.08);
    }

    .goal-star-shell.lit .goal-star-off {
      opacity: 0.24;
      transform: scale(0.88);
    }

    .thermo {
      position: relative;
      width: 38px;
      height: 186px;
      padding: 7px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(226, 232, 240, 0.94));
      box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.92), 0 10px 20px rgba(31, 41, 55, 0.18);
    }

    .thermo-track {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 999px;
      background: linear-gradient(180deg, #f3f4f6 0%, #d1d5db 100%);
      border: 2px solid rgba(148, 163, 184, 0.55);
    }

    .thermo-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 0%;
      border-radius: 999px 999px 18px 18px;
      background: linear-gradient(180deg, #fcd34d 0%, #fb7185 52%, #f97316 100%);
      box-shadow: inset 0 -4px 8px rgba(255, 255, 255, 0.3), 0 0 14px rgba(251, 113, 133, 0.42);
      transition: height 440ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 220ms ease;
    }

    .thermo-bulb {
      position: absolute;
      left: 50%;
      bottom: -12px;
      width: 54px;
      height: 54px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(226, 232, 240, 0.94));
      box-shadow: inset 0 4px 8px rgba(255, 255, 255, 0.92), 0 10px 18px rgba(31, 41, 55, 0.18);
    }

    .thermo-bulb::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 30%, #fde68a 0%, #fb7185 58%, #f97316 100%);
      opacity: var(--bulb-glow, 0.22);
      transition: opacity 220ms ease;
    }

    .star-bank-section {
      margin-top: 18px;
      padding: 14px 10px 4px;
    }

    .star-bank-label {
      margin-bottom: 8px;
      text-align: left;
      font-size: clamp(0.95rem, 3.4vw, 1.05rem);
      font-weight: 900;
      color: #475569;
      letter-spacing: 0.03em;
    }

    .stars-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      justify-content: flex-start;
      align-items: flex-start;
      min-height: 58px;
    }

    .star-token {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      font-size: 2rem;
      line-height: 1;
      filter: drop-shadow(0 5px 10px rgba(250, 204, 21, 0.45));
      animation: bank-star-dance 1700ms ease-in-out infinite;
      animation-delay: var(--dance-delay, 0ms);
    }

    .star-token.placeholder {
      opacity: 0;
      animation: none;
    }

    .floating-star {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 40;
      font-size: 2.3rem;
      line-height: 1;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1.1) rotate(0deg);
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 18px rgba(250, 204, 21, 0.7));
      transition: left 1180ms cubic-bezier(0.22, 1, 0.36, 1), top 1180ms cubic-bezier(0.22, 1, 0.36, 1), transform 1180ms cubic-bezier(0.22, 1, 0.36, 1), opacity 1180ms ease;
      animation: falling-star-wiggle 260ms ease-in-out infinite alternate, falling-star-sparkle 520ms ease-in-out infinite;
    }

    .floating-star.is-dropping {
      transform: translate(-50%, -50%) scale(0.86) rotate(540deg);
    }

    .party-mode .hero,
    .party-mode .card,
    .party-mode .topbar,
    .party-mode .letters-row,
    .party-mode .answers,
    .party-mode .game-rail,
    .party-mode .star-bank-section {
      animation: party-sway 860ms ease-in-out infinite alternate;
      transform-origin: center;
    }

    .party-star {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 50;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      font-size: 2.25rem;
      line-height: 1;
      pointer-events: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.98)) drop-shadow(0 0 18px rgba(250, 204, 21, 0.82));
      animation: party-star-twinkle 420ms ease-in-out infinite alternate;
      will-change: left, top, transform;
    }

    .party-star.returning {
      transition: left 980ms cubic-bezier(0.22, 1, 0.36, 1), top 980ms cubic-bezier(0.22, 1, 0.36, 1), transform 980ms cubic-bezier(0.22, 1, 0.36, 1), opacity 980ms ease;
      transform: translate(-50%, -50%) scale(0.88);
    }

    .star-token.return-slot {
      opacity: 0;
      animation: none;
    }

    .letters-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: nowrap;
      min-width: 0;
      padding-right: 6px;
    }

    .letter-button {
      min-width: clamp(42px, 11vw, 66px);
      aspect-ratio: 1 / 1;
      border: none;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.18)), #fde68a;
      box-shadow: 0 8px 0 rgba(255, 255, 255, 0.7), 0 12px 22px rgba(31, 41, 55, 0.16);
      color: #0f172a;
      cursor: pointer;
      font-family: "Chalkboard SE", "Marker Felt", "Comic Sans MS", "Trebuchet MS", sans-serif;
      font-size: clamp(1.4rem, 5.2vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
    }

    .letter-button.is-playing {
      transform: translateY(-5px) scale(1.18);
      box-shadow: 0 12px 0 rgba(255, 255, 255, 0.78), 0 18px 28px rgba(31, 41, 55, 0.24);
      filter: saturate(1.12) brightness(1.05);
      animation: letter-rock 90ms ease-in-out infinite alternate;
    }

    .letter-button:active {
      transform: translateY(5px) scale(0.98);
      box-shadow: 0 3px 0 rgba(255, 255, 255, 0.75), 0 8px 14px rgba(31, 41, 55, 0.18);
    }

    .letter-button:disabled {
      cursor: default;
    }

    .letter-button:focus-visible,
    .emoji-button:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.92);
      outline-offset: 3px;
    }

    .answers {
      display: grid;
      gap: 10px;
      width: min(112px, 24vw);
      min-width: 90px;
    }

    .emoji-button {
      position: relative;
      aspect-ratio: 1 / 1;
      width: 100%;
      border: none;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.15)),
        var(--button-color, #fca5a5);
      box-shadow: 0 8px 0 rgba(255, 255, 255, 0.7), 0 12px 22px rgba(31, 41, 55, 0.16);
      color: #0f172a;
      cursor: pointer;
      font-size: clamp(2.2rem, 9vw, 3.5rem);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease, background 120ms ease;
      overflow: visible;
    }

    .emoji-button:active {
      transform: translateY(5px) scale(0.98);
      box-shadow: 0 3px 0 rgba(255, 255, 255, 0.75), 0 8px 14px rgba(31, 41, 55, 0.18);
    }

    .emoji-button.correct {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.18)), #86efac;
      animation: correct-dance 700ms ease;
      transform-origin: center;
      z-index: 2;
    }

    .emoji-button.wrong {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.18)), #fca5a5;
      color: #7f1d1d;
      animation: wrong-shake 360ms ease;
    }

    .emoji-button.is-playing {
      transform: translateY(-5px) scale(1.18);
      box-shadow: 0 12px 0 rgba(255, 255, 255, 0.78), 0 18px 28px rgba(31, 41, 55, 0.24);
      filter: saturate(1.12) brightness(1.05);
      animation: letter-rock 90ms ease-in-out infinite alternate;
      z-index: 2;
    }

    .emoji-button.sparkle-burst .sparkle {
      animation: sparkle-burst 620ms ease-out forwards;
    }

    @keyframes letter-rock {
      from {
        transform: translateY(-5px) scale(1.18) rotate(-6deg);
      }

      to {
        transform: translateY(-5px) scale(1.18) rotate(6deg);
      }
    }

    .sparkle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      margin-top: -7px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, currentColor 45%, rgba(255, 255, 255, 0) 70%);
      opacity: 0;
      pointer-events: none;
      transform: rotate(var(--angle)) translateY(0) scale(0.2);
      color: var(--sparkle-color, #facc15);
    }

    .status {
      min-height: 1.6em;
      margin: 16px 0 0;
      text-align: center;
      font-size: clamp(1rem, 3.8vw, 1.15rem);
      font-weight: 800;
    }

    .status.good {
      color: var(--good);
    }

    .status.bad {
      color: var(--bad);
    }

    .hint {
      margin: 8px 0 0;
      text-align: center;
      font-size: clamp(0.95rem, 3.4vw, 1.05rem);
      line-height: 1.35;
      font-weight: 700;
    }

    @keyframes wrong-shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-10px) rotate(-3deg); }
      40% { transform: translateX(10px) rotate(3deg); }
      60% { transform: translateX(-8px) rotate(-2deg); }
      80% { transform: translateX(8px) rotate(2deg); }
      100% { transform: translateX(0); }
    }

    @keyframes correct-dance {
      0% { transform: scale(1); }
      18% { transform: scale(1.18) rotate(-7deg); }
      36% { transform: scale(1.26) rotate(7deg); }
      54% { transform: scale(1.2) rotate(-5deg); }
      72% { transform: scale(1.1) rotate(4deg); }
      100% { transform: scale(1.12) rotate(0deg); }
    }

    @keyframes sparkle-burst {
      0% {
        opacity: 0.2;
        transform: rotate(var(--angle)) translateY(0) scale(0.2);
      }
      25% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: rotate(var(--angle)) translateY(-64px) scale(1.1);
      }
    }

    @keyframes bank-star-dance {
      0% { transform: translateX(-1px) rotate(-4deg) translateY(0); }
      50% { transform: translateX(1px) rotate(4deg) translateY(-3px); }
      100% { transform: translateX(-1px) rotate(-4deg) translateY(0); }
    }

    @keyframes falling-star-wiggle {
      0% { margin-left: -2px; }
      100% { margin-left: 2px; }
    }

    @keyframes falling-star-sparkle {
      0% { opacity: 0.9; }
      50% { opacity: 1; }
      100% { opacity: 0.86; }
    }

    @keyframes party-sway {
      from { transform: rotate(-1.7deg) scale(1); }
      to { transform: rotate(1.7deg) scale(1.02); }
    }

    @keyframes party-star-twinkle {
      from { transform: translate(-50%, -50%) scale(0.92) rotate(-10deg); }
      to { transform: translate(-50%, -50%) scale(1.12) rotate(10deg); }
    }

    @media (max-width: 480px) {
      .problem-shell {
        gap: 10px;
        grid-template-columns: minmax(0, 1fr) minmax(82px, 96px) 62px;
      }

      .letters-row {
        gap: 6px;
      }

      .answers {
        width: min(96px, 27vw);
        min-width: 84px;
      }

      .game-rail {
        width: 62px;
      }

      .thermo {
        width: 32px;
        height: 164px;
      }

      .thermo-bulb {
        width: 46px;
        height: 46px;
      }
    }
  </style>
</head>

    async function getAudioDuration(audioPath) {
      if (!audioPath) {
        return 0;

      return await new Promise((resolve) => {
        const probe = new Audio();
        const finish = (value) => {
          probe.src = "";
          resolve(value);
        };

        probe.preload = "metadata";
        probe.src = audioPath;
        if (probe.readyState >= 1 && Number.isFinite(probe.duration)) {
          finish(probe.duration);
          return;
        }

        probe.addEventListener(
          "loadedmetadata",
          () => {
            finish(Number.isFinite(probe.duration) ? probe.duration : 0);
          },
          { once: true }
        );
        probe.addEventListener("error", () => finish(0), { once: true });
      });
    }

        letterAudioBufferCache.set(audioPath, bufferPromise);

    function animateBankCompaction(removedToken, durationMs) {
      const tokens = getVisibleStarTokens();
      const beforeRects = new Map(tokens.map((token) => [token, token.getBoundingClientRect()]));
      removedToken.remove();
      getVisibleStarTokens().forEach((token) => {
        const beforeRect = beforeRects.get(token);
        const afterRect = token.getBoundingClientRect();
        const dx = beforeRect.left - afterRect.left;
        const dy = beforeRect.top - afterRect.top;
        if (dx === 0 && dy === 0) {

        token.animate(
          [
            { transform: `translate(${dx}px, ${dy}px)` },
            { transform: "translate(0, 0)" },
          ],
          {
            duration: durationMs,
            easing: "cubic-bezier(0.22, 1, 0.36, 1)",
            fill: "both",

    function createPartyStarFromToken(token) {
      const rect = token.getBoundingClientRect();
      const star = document.createElement("span");
      star.className = "party-star";

      document.body.appendChild(star);

      const angle = Math.random() * Math.PI * 2;
      const speed = 220 * (0.8 + Math.random() * 0.4);

      return {
        element: star,
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: Math.max(rect.width, 40),

    function renderPartyStar(star) {

    function startPartyPhysics() {
      let lastTime = performance.now();

      const step = (now) => {
        const dt = Math.min((now - lastTime) / 1000, 0.04);
        lastTime = now;
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        flyingPartyStars.forEach((star) => {
          star.x += star.vx * dt;
          star.y += star.vy * dt;

          const half = star.size / 2;
          if (star.x <= half) {
            star.x = half;
            star.vx = Math.abs(star.vx);
          } else if (star.x >= viewportWidth - half) {
            star.x = viewportWidth - half;
            star.vx = -Math.abs(star.vx);
          }

          if (star.y <= half) {
            star.y = half;
            star.vy = Math.abs(star.vy);
          } else if (star.y >= viewportHeight - half) {
            star.y = viewportHeight - half;
            star.vy = -Math.abs(star.vy);
          }

          renderPartyStar(star);
        });

        partyAnimationFrame = window.requestAnimationFrame(step);
      };

      if (partyAnimationFrame) {
        window.cancelAnimationFrame(partyAnimationFrame);
      }
      partyAnimationFrame = window.requestAnimationFrame(step);
    }

    async function returnPartyStars(slots) {

        const slot = slots[index];
        const rect = slot.getBoundingClientRect();
        return new Promise((resolve) => {
          let settled = false;
          const finish = () => {
            if (settled) {
              return;

            settled = true;
            resolve();
          };

          star.element.addEventListener("transitionend", finish, { once: true });
          window.setTimeout(finish, 1100);
          star.element.classList.add("returning");
          star.element.style.left = `${rect.left + rect.width / 2}px`;
          star.element.style.top = `${rect.top + rect.height / 2}px`;
        });
      });

      await Promise.all(animations);

      flyingPartyStars.forEach((star) => {
        star.element.remove();

      flyingPartyStars = [];

      slots.forEach((slot, index) => {

      const totalDurationMs = Math.max(await getAudioDuration(readingConfig.star_party) * 1000, 1000);
      const intervalMs = starCount > 1 ? totalDurationMs / (starCount + 2) : totalDurationMs;
      const compactionDuration = Math.max(90, Math.min(540, intervalMs * 0.78));
      const playback = playPartySound();

      startPartyPhysics();

      for (let index = 0; index < starCount; index += 1) {
        const token = getVisibleStarTokens()[0];
        if (!token) {
          break;

        const partyStar = createPartyStarFromToken(token);
        flyingPartyStars.push(partyStar);
        renderPartyStar(partyStar);
        animateBankCompaction(token, compactionDuration);

        if (index < starCount - 1) {
          await wait(intervalMs);
        }
      }

      await playback;
      stopPartyPhysics();

      const slots = createReturnSlots(starCount);
      await new Promise((resolve) => requestAnimationFrame(resolve));
      await returnPartyStars(slots);
      document.body.classList.remove("party-mode");
    }

          resolve();

        floatingStar.addEventListener("transitionend", finish, { once: true });

        floatingStar.style.top = `${endRect.top + endRect.height / 2}px`;
      });

      const magicPlayback = playMagicSound();
  streakCount = 0;
  setMeterProgress(0);
      await animationPromise;
      floatingStar.remove();
      finalizeBankStar(placeholder);
      const totalStars = getStarCount();
      await magicPlayback;
      await wait(120);
      return totalStars;

    }

    async function playWordSound(audioPath) {
      if (!audioPath) {
        return;
      }

      wordPlayer.pause();
      wordPlayer.currentTime = 0;
      wordPlayer.src = audioPath;

      try {
        await wordPlayer.play();
        await new Promise((resolve) => {
          const finish = () => {
            wordPlayer.removeEventListener("ended", finish);
            wordPlayer.removeEventListener("error", finish);
            wordPlayer.removeEventListener("pause", finish);
            wordPlayer.removeEventListener("emptied", finish);
            resolve();
          };

          wordPlayer.addEventListener("ended", finish, { once: true });
          wordPlayer.addEventListener("error", finish, { once: true });
          wordPlayer.addEventListener("pause", finish, { once: true });
          wordPlayer.addEventListener("emptied", finish, { once: true });
        });
      } catch (error) {
        console.error("Unable to play word audio", error);
      }
    }

    function buildProblem() {
      const vocabulary = pageConfig.vocabulary;
      const eligibleWords = vocabulary.filter((item) => !recentWords.includes(item.word));
      const pool = eligibleWords.length > 0 ? eligibleWords : vocabulary;
      const correctItem = pool[randomInt(0, pool.length - 1)];
      recentWords.push(correctItem.word);
      if (recentWords.length > 3) {
        recentWords.shift();
      }
      const distractors = shuffle(vocabulary.filter((item) => item.word !== correctItem.word)).slice(0, 2);
      const answers = shuffle([
        { emoji: correctItem.emoji, audio: correctItem.audio, isCorrect: true },
        ...distractors.map((item) => ({ emoji: item.emoji, audio: item.audio, isCorrect: false })),
      ]);

      return {
        letters: correctItem.letters,
        audio: correctItem.audio,
        answers,
      };
    }

    function burstSparkles(button) {
      button.classList.remove("sparkle-burst");
      button.querySelectorAll(".sparkle").forEach((sparkle) => sparkle.remove());

      for (let index = 0; index < 8; index += 1) {
        const sparkle = document.createElement("span");
        sparkle.className = "sparkle";
        sparkle.style.setProperty("--angle", `${index * 45}deg`);
        sparkle.style.setProperty(
          "--sparkle-color",
          sparklePalette[index % sparklePalette.length]
        );
        button.appendChild(sparkle);
      }

      button.classList.add("sparkle-burst");
      window.setTimeout(() => {
        button.classList.remove("sparkle-burst");
        button.querySelectorAll(".sparkle").forEach((sparkle) => sparkle.remove());
      }, 650);
    }

    function renderProblem() {
      stopLetterSequencePlayback();
      currentProblem = buildProblem();
      roundFirstTry = true;
      lettersRow.innerHTML = "";
      answersElement.innerHTML = "";
      setStatus("", "");

      currentProblem.letters.forEach((letter) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "letter-button";
        button.textContent = letter.label;
        button.setAttribute("aria-label", `Letter ${letter.label}`);
        button.addEventListener("click", () => {
          void playPromptSequence();
        });
        lettersRow.appendChild(button);
      });

      primeLetterAudioBuffers(currentProblem.letters);

      currentProblem.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "emoji-button";
        button.textContent = answer.emoji;
        button.style.setProperty("--button-color", answerPalette[index % answerPalette.length]);
        button.setAttribute("aria-label", `Emoji ${answer.emoji}`);
        button.addEventListener("click", () => handleAnswer(button, answer.isCorrect));
        answersElement.appendChild(button);
      });

      applyInteractionLock();
    }

    async function handleAnswer(button, isCorrect) {
      if (isResolving || isPartyLockActive || button.disabled) {
        return;
      }

      stopMagicSound();
      const resolutionId = ++activeResolutionId;
      const buttons = [...answersElement.querySelectorAll(".emoji-button")];
      if (isCorrect) {
        setResolvingState(true);
        stopLetterSequencePlayback();
        if (roundFirstTry) {
          streakCount = Math.min(streakCount + 1, correctAnswersPerStar);
          setMeterProgress(streakCount);
        } else {
          streakCount = 0;
          setMeterProgress(0);
        }
        const playback = (async () => {
          await playCorrectSound();
          await playWordSound(currentProblem.audio);
        })();
        button.classList.add("correct");
        burstSparkles(button);
        setStatus("Great job!", "good");
        buttons.forEach((item) => {
          item.disabled = true;
        });
        await playback;
        if (streakCount === correctAnswersPerStar) {
          setStatus("Star earned!", "good");
          const willTriggerParty = (getStarCount() + 1) % 7 === 0;
          setMilestonePending(true);
          const milestonePromise = (async () => {
            try {
              return await celebrateMilestone();
            } finally {
              setMilestonePending(false);
            }
          })();
          renderProblem();
          if (willTriggerParty) {
            setPartyInteractionLock(true);
          } else {
            setResolvingState(false);
          }
          const totalStars = await milestonePromise;
          if (resolutionId !== activeResolutionId) {
            return;
          }
          if (willTriggerParty && totalStars > 0 && totalStars % 7 === 0) {
            setStatus("Star party!", "good");
            await runStarParty();
          }
          if (willTriggerParty) {
            setPartyInteractionLock(false);
            setResolvingState(false);
          }
          return;
        }
        if (resolutionId === activeResolutionId) {
          setResolvingState(false);
        }
        window.setTimeout(renderProblem, 250);
        return;
      }

      setResolvingState(true);
      stopLetterSequencePlayback();
      roundFirstTry = false;
      streakCount = 0;
      setMeterProgress(0);
      const playback = (async () => {
        await playWrongSound();
        await playWordSound(currentProblem.audio);
      })();
      button.classList.remove("wrong");
      void button.offsetWidth;
      button.classList.add("wrong");
      buttons.forEach((item) => {
        item.disabled = true;
      });
      setStatus("Try again!", "bad");
      await playback;
      buttons.forEach((item) => {
        item.disabled = item === button;
      });
      if (resolutionId === activeResolutionId) {
        setResolvingState(false);
      }
    }

    setMeterProgress(0);
    renderProblem();
  </script>
</body>
