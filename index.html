<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="English Playtime" />
  <meta name="application-name" content="English Playtime" />
  <meta name="theme-color" content="#67e8f9" />
  <meta name="app-version" content="20260822001023" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png" />
  <link rel="manifest" href="site.webmanifest" />
  <title>English App</title>
  <style>
    :root {
      --ink: #1f2937;
      --cream: #fffaf0;
      --bubble: #ffffffcc;
      --shadow: rgba(15, 23, 42, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Comic Sans MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.9), transparent 22%),
        radial-gradient(circle at 85% 18%, rgba(255, 255, 255, 0.75), transparent 18%),
        linear-gradient(180deg, #67e8f9 0%, #a7f3d0 42%, #fde68a 100%);
    }

    .page {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .title {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.4rem);
      line-height: 0.95;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #0f172a;
      text-shadow: 0 4px 0 rgba(255, 255, 255, 0.65);
    }

    .subtitle {
      margin: 12px auto 0;
      max-width: 28rem;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--bubble);
      font-size: clamp(1rem, 3.6vw, 1.2rem);
      line-height: 1.35;
      font-weight: 700;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .menu-card {
      display: block;
      min-height: 220px;
      padding: 18px;
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.48), rgba(255, 255, 255, 0.24)),
        var(--card-color, #f9a8d4);
      box-shadow: 0 12px 0 rgba(255, 255, 255, 0.6), 0 18px 34px var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    .menu-card:active {
      transform: translateY(6px) scale(0.98);
      box-shadow: 0 5px 0 rgba(255, 255, 255, 0.7), 0 10px 18px var(--shadow);
    }

    .menu-card:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.92);
      outline-offset: 4px;
    }

    .menu-inner {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .menu-icon {
      font-size: clamp(3rem, 12vw, 4.5rem);
      line-height: 1;
    }

    .menu-title {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      line-height: 1.15;
      font-weight: 800;
    }

    .menu-subtitle {
      font-size: clamp(1rem, 3.4vw, 1.15rem);
      line-height: 1.2;
      font-weight: 700;
    }

    @media (min-width: 700px) {
      .page {
        padding-top: 40px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1 class="title">English Playtime</h1>
      <p class="subtitle">Choose a fun activity to start learning.</p>
    </header>
    <section class="menu-grid" id="menu-grid"></section>
  </main>

  <script>
    const appVersion = "20260822001023";
    const versionInfoPath = "app_version.json";
    const pages = [
  {
    "emoji": "🗣️",
    "title": "Short Sentences",
    "subtitle": "Những câu ngắn",
    "href": "output/short_sentences.html",
    "audio": "assets/audio/Menu/Short%20Sentences.m4a?v=20260628-1"
  },
  {
    "emoji": "🔤",
    "title": "Letter Sounds",
    "subtitle": "âm của chữ cái",
    "href": "output/letter_sounds.html",
    "audio": "assets/audio/Menu/Letter%20sounds.m4a?v=20260628-1"
  },
  {
    "emoji": "➕➖",
    "title": "Math",
    "subtitle": "toán học",
    "href": "output/math.html",
    "audio": "assets/audio/Menu/Math.m4a?v=20260628-1"
  },
  {
    "emoji": "📖",
    "title": "Reading",
    "subtitle": "đọc",
    "href": "output/reading.html",
    "audio": "assets/audio/Menu/Reading.m4a?v=20260628-1"
  },
  {
    "emoji": "✏️",
    "title": "Spelling",
    "subtitle": "đánh vần",
    "href": "output/spelling.html",
    "audio": "assets/audio/Menu/Spelling.m4a?v=20260628-1"
  }
];
    const colors = ["#f9a8d4", "#93c5fd", "#86efac", "#fdba74", "#fcd34d", "#c4b5fd"];
    const menuGrid = document.getElementById("menu-grid");
    const player = new Audio();

    function withVersion(href, version = appVersion) {
      const url = new URL(href, window.location.href);
      url.searchParams.set("v", version);
      return url.toString();
    }

    async function ensureLatestVersion() {
      try {
        const response = await fetch(`${versionInfoPath}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          return;
        }

        const latest = await response.json();
        if (!latest.version || latest.version === appVersion) {
          return;
        }

        window.location.replace(withVersion(window.location.pathname + window.location.search + window.location.hash, latest.version));
      } catch (error) {
        console.error("Unable to check app version", error);
      }
    }

    async function playThenNavigate(audioPath, href) {
      const destination = withVersion(href);
      if (!audioPath) {
        window.location.href = destination;
        return;
      }

      player.pause();
      player.currentTime = 0;
      player.src = audioPath;

      try {
        await player.play();
        player.addEventListener(
          "ended",
          () => {
            window.location.href = destination;
          },
          { once: true }
        );
      } catch (error) {
        console.error("Unable to play menu audio", error);
        window.location.href = destination;
      }
    }

    void ensureLatestVersion();

    pages.forEach((page, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "menu-card";
      button.style.setProperty("--card-color", colors[index % colors.length]);
      button.setAttribute("aria-label", `${page.title} - ${page.subtitle}`);
      button.innerHTML = `
        <span class="menu-inner">
          <span class="menu-icon">${page.emoji}</span>
          <span class="menu-title">${page.title}</span>
          <span class="menu-subtitle">${page.subtitle}</span>
        </span>
      `;
      button.addEventListener("click", () => playThenNavigate(page.audio, page.href));
      menuGrid.appendChild(button);
    });
  </script>
</body>
</html>
